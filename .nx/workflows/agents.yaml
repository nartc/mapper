launch-templates:
    linux-medium-node20:
        resource-class: 'docker_linux_amd64/medium'
        image: 'ubuntu22.04-node24.14-v1'
        init-steps:
            - name: Checkout
              uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

            - name: Select Node 20
              script: echo 'MISE_NODE_VERSION=20' >> "$NX_CLOUD_ENV"

            - name: Install toolchain
              uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-mise/main.yaml'

            - name: Install Node Modules
              uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/install-node-modules/main.yaml'

    linux-medium-node22:
        resource-class: 'docker_linux_amd64/medium'
        image: 'ubuntu22.04-node24.14-v1'
        init-steps:
            - name: Checkout
              uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

            - name: Select Node 22
              script: echo 'MISE_NODE_VERSION=22' >> "$NX_CLOUD_ENV"

            - name: Install toolchain
              uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-mise/main.yaml'

            - name: Install Node Modules
              uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/install-node-modules/main.yaml'
